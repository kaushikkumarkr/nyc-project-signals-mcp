[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-project-signals"
version = "0.1.0"
description = "Evidence-linked NYC public-record signals and MCP tools"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.17.0,<2",
  "anyio>=4.9,<5",
]

[project.scripts]
nyc-project-signals = "nyc_signals.__main__:main"

[tool.setuptools.packages.find]
include = ["nyc_signals*"]
